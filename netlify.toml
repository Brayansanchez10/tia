# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Las rutas /api/* también están en public/_redirects (copiado a dist).
# Netlify Functions: CLOUDINARY_*, DATABASE_URL, DATABASE_URL_UNPOOLED, VITE_ADMIN_PASSWORD
